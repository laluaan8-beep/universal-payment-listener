name: Build Pecut Payment Listener APK

on:
  workflow_dispatch:
  push:
    branches:
      - pecut-v1.3.0-logo-apk
    paths:
      - '.buildsrc/**'
      - '.github/workflows/build-pecut-v1.3.1-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat .buildsrc/part01.b64 .buildsrc/part02.b64 .buildsrc/part03.b64 .buildsrc/part04a.b64 .buildsrc/part04b.b64 > /tmp/pecut-src.b64
          base64 -d /tmp/pecut-src.b64 > /tmp/pecut-src.zip
          unzip -q /tmp/pecut-src.zip -d "$GITHUB_WORKSPACE"
          test -f pecut_lean/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p pecut_lean assembleDebug --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp pecut_lean/app/build/outputs/apk/debug/app-debug.apk dist/Pecut-Payment-Listener-v1.3.1-debug.apk
          sha256sum dist/Pecut-Payment-Listener-v1.3.1-debug.apk > dist/Pecut-Payment-Listener-v1.3.1-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pecut-Payment-Listener-v1.3.1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
